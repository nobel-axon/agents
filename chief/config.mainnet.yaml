# axon-chief mainnet configuration
port: "9100"
adminPort: "9101"

chain:
  # rpcUrl loaded from MONAD_RPC_URL env var
  chainId: 143
  # operatorKey loaded from OPERATOR_PRIVATE_KEY env var
  arenaAddress: "0xf7Bc6B95d39f527d351BF5afE6045Db932f37171"
  neuronAddress: "0xDa2A083164f58BaFa8bB8E117dA9d4D1E7e67777"
  gasLimitBuffer: 50000
  maxGasPrice: "100000000000"  # 100 gwei for mainnet
  txRetryCount: 5
  txRetryIntervalMs: 2000

judges:
  # Role-specific agent endpoints
  philosopherEndpoint: "http://localhost:9001"
  directorEndpoint: "http://localhost:9002"
  judgeEndpoints:
    - "http://localhost:9003"
    - "http://localhost:9004"
    - "http://localhost:9005"
  timeoutMs: 30000
  consensusThreshold: 2
  retryCount: 3

match:
  entryFee: "100000000000000000"      # 0.1 MON
  baseAnswerFee: "1000000000000000000" # 1 NEURON
  queueDuration: 1h      # Long queue — match starts on minPlayers join, not timeout
  answerDuration: 3m
  gapDuration: 15s  # Time for reveal phase (question + judges visible)
  minPlayers: 2
  maxPlayers: 10
  autoCreate: true
  cooldown: 30s     # Production cooldown between matches
  registrationGrace: 30s  # Grace period after minPlayers reached to allow more players

watcher:
  timeoutCheckInterval: 10s
  staleCheckInterval: 30s
  staleThreshold: 30s
  eventPollInterval: 500ms
  ponderHealthThreshold: 30s
  ponderLagBlocks: 10
  directChainPolling: false  # Disabled — events come via Ponder (axon-server POST /event)

# adminToken loaded from ADMIN_TOKEN env var

nadFun:
  # Monad mainnet has nad.fun — enable real swaps
  treasuryFallback: false
  burnSwapRetries: 3
