services:
  philosopher:
    build: .
    container_name: axon-philosopher
    environment:
      - AGENT_ROLE=philosopher
      - AGENT_ID=philosopher
      - PRIMARY_LLM=kimi
      - PORT=9001
      - GLM_API_KEY=${GLM_API_KEY}
      - KIMI_API_KEY=${KIMI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - LLM_QUESTIONS_ENABLED=true
    ports:
      - "9001:9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

